

databases:
  - name: heemia-db
    databaseName: heemia
    user: heemia
    plan: basic-256mb # piano a pagamento: il free scade dopo 30 giorni e non ha backup
    region: frankfurt # dati in UE
    postgresMajorVersion: "16" # stessa versione dello sviluppo locale

  # --- Staging (Fase 20) ---
  # Database separato, MAI un clone della produzione: su staging si prova l'import del
  # censimento e si sbaglia liberamente, e nessun dato di un cliente vero deve finirci.
  - name: heemia-db-staging
    databaseName: heemia_staging
    user: heemia
    plan: basic-256mb # il piano free scade dopo 30 giorni: uno staging che sparisce non serve
    region: frankfurt
    postgresMajorVersion: "16"

services:
  # --- Backend: API Fastify + Prisma ---
  - type: web
    name: heemia-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: server
    # prisma generate serve prima di compilare; migrate deploy applica le migrazioni
    # versionate a ogni deploy (mai `db push` in produzione).
    # `--include=dev` è necessario: NODE_ENV=production (impostata sotto per il runtime)
    # fa sì che npm ometta le devDependencies, e lì stanno TypeScript e @types/node —
    # senza, la compilazione fallisce con "Cannot find type definition file for 'node'".
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Migrazioni + seed a ogni deploy. Il seed è idempotente (upsert) e in produzione
    # crea SOLO le impostazioni di calcolo e il primo utente admin: nessun dato di esempio.
    preDeployCommand: npx prisma migrate deploy && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: heemia-db
          property: connectionString # connessione interna, non passa da internet
      - key: SESSION_SECRET
        generateValue: true # generato da Render, mai visibile nel repo
      # Durata della sessione: 360 ore = 15 giorni. Non si rinnova con l'uso, la scadenza
      # è fissata al momento dell'accesso.
      - key: SESSION_TTL_HOURS
        value: "360"
      # ⚠️ Qui servono gli URL PUBBLICI. `fromService … property: host` restituisce
      # l'hostname interno della rete privata Render (es. "heemia-api"), che il browser
      # non sa risolvere: il frontend chiamerebbe https://heemia-api e ogni richiesta
      # fallirebbe. Perciò i due indirizzi sono scritti per esteso.
      - key: APP_BASE_URL
        value: https://heemia-api.onrender.com
      - key: CORS_ORIGIN
        value: https://heemia-app.onrender.com
      # Segreti delle integrazioni: dichiarati qui senza valore (`sync: false`), si
      # compilano nel pannello Render quando l'integrazione entra in servizio. Finché
      # mancano, l'app funziona e ogni funzione dice quale variabile le serve
      # (Integrazioni_Setup.md, `GET /api/v1/integrations/status`).
      # AI: fornitore OpenAI dal 2026-08-08 (DEC-050). OPENAI_MODEL è facoltativa.
      # OPENAI_API_KEY dal 2026-09-09 è il RIPIEGO, non la via principale: la chiave la
      # inserisce la CEO dall'app (Impostazioni → Account OpenAI dell'azienda) e resta
      # cifrata a database. Qui resta dichiarata perché è la via di rientro: se la chiave
      # inserita si rivelasse sbagliata, il server torna a questa. Normalmente si lascia
      # vuota — nessuno deve dover aprire questo pannello per accendere l'AI.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      # Le app create dal Dev Dashboard non espongono piu' un token Admin fisso: il server
      # scambia Client ID e Client Secret per un token che dura 24 ore e lo rinnova da se'
      # (shopify/client.ts). SHOPIFY_ADMIN_API_TOKEN resta solo per le vecchie custom app:
      # se e' valorizzato vince lui, quindi in produzione va lasciato vuoto.
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_ADMIN_API_TOKEN
        sync: false
      - key: SHOPIFY_API_VERSION
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      # Gmail, invio richieste ai fornitori (DEC-028): servono tutte e quattro.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GMAIL_MITTENTE
        sync: false
      # Service account per leggere le cartelle Drive con le foto dei capi (DEC-052).
      # Può essere lo stesso di Analytics: in quel caso basta GA_CREDENTIALS_JSON.
      - key: GOOGLE_DRIVE_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # Google Analytics 4 (pagina Analytics): identificativo numerico della proprietà e
      # JSON del service account su una riga. Finché mancano, /analytics/* risponde che
      # l'integrazione non è collegata e il riquadro in dashboard non compare.
      - key: GA_PROPERTY_ID
        sync: false
      - key: GA_CREDENTIALS_JSON
        sync: false
      # Password del primo amministratore, usata una sola volta dal seed: serve a entrare la
      # prima volta. Dopo, gli utenti si creano dall'app e ognuno cambia la propria password.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Via di recupero se la password dell'amministratore si perde: impostare a "true",
      # rilanciare il deploy, poi RIMUOVERLA. Finché resta, ogni deploy sovrascrive la
      # password scelta dalla persona con il valore di SEED_ADMIN_PASSWORD.
      - key: SEED_ADMIN_FORCE_PASSWORD
        sync: false

  # --- Frontend: build statica Vite ---
  - type: web
    name: heemia-app
    runtime: static
    # Anche qui gli strumenti di build (Vite, TypeScript) stanno nelle devDependencies.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      # Variabile di BUILD: l'URL dell'API finisce dentro il bundle, quindi cambiarla
      # richiede un nuovo deploy del sito statico, non basta salvare la variabile.
      #
      # "/" significa **stessa origine**: il frontend chiama /api/... su heemia-app e ci
      # pensa la regola qui sotto a inoltrare al backend. Prima c'era l'indirizzo per
      # esteso di heemia-api, e il cookie di sessione diventava un cookie di terze parti
      # (per il browser heemia-app e heemia-api sono due siti diversi: onrender.com è un
      # suffisso pubblico). Safari li blocca di default: login riuscito, cookie scartato,
      # richiesta successiva senza sessione → "sessione scaduta". Vedi DEC-048.
      - key: VITE_API_BASE_URL
        value: /
    routes:
      # ⚠️ L'ordine conta: vince la prima regola che combacia. L'inoltro all'API deve
      # stare PRIMA del catch-all della SPA, altrimenti /api/... tornerebbe index.html.
      #
      # Il browser vede una sola origine (heemia-app.onrender.com), quindi il cookie di
      # sessione è di prima parte: niente cookie di terze parti da bloccare e niente
      # preflight CORS. Il backend resta comunque raggiungibile direttamente su
      # heemia-api.onrender.com (serve al controllo di /health e allo sviluppo).
      - type: rewrite
        source: /api/*
        destination: https://heemia-api.onrender.com/api/*
      # SPA: ogni percorso sconosciuto torna index.html, così i link diretti
      # (es. /prodotti/<id>) funzionano anche al primo caricamento.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex # gestionale interno: fuori dai motori di ricerca

  # --- Staging: API (Fase 20) ---
  # Stesso codice della produzione, database diverso e nessuna credenziale esterna.
  # Le integrazioni restano SPENTE per scelta: su staging si prova l'app, non Shopify —
  # una scrittura di giacenze partita da qui finirebbe sul negozio vero.
  - type: web
    name: heemia-api-staging
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: server
    branch: staging # il ramo di collaudo: la produzione resta su main
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production # stesse condizioni della produzione: e' il senso di uno staging
      - key: DATABASE_URL
        fromDatabase:
          name: heemia-db-staging
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true # diverso da quello di produzione: una sessione non deve valere su entrambi
      - key: SESSION_TTL_HOURS
        value: "360"
      - key: APP_BASE_URL
        value: https://heemia-api-staging.onrender.com
      - key: CORS_ORIGIN
        value: https://heemia-app-staging.onrender.com
      # Amministratore di collaudo: si compilano nel pannello, con una password diversa da
      # quella di produzione. Senza, il seed non crea nessun utente e non si entra.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Nessuna variabile di integrazione dichiarata qui: cio' che non esiste non puo'
      # essere compilato per sbaglio con un segreto di produzione.

  # --- Staging: frontend (Fase 20) ---
  - type: web
    name: heemia-app-staging
    runtime: static
    branch: staging
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: / # stessa origine, come in produzione (DEC-048): il cookie resta di prima parte
    routes:
      - type: rewrite
        source: /api/*
        destination: https://heemia-api-staging.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
